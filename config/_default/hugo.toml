baseURL = "https://tykowale.com/"
theme = "congo"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
  [services.googleAnalytics]
    id = "G-E8J5HNV6H2"
